services:
  postgres:
    image: postgres:16-alpine
    container_name: rolesmith-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: rolesmith
      POSTGRES_PASSWORD: rolesmith
      POSTGRES_DB: rolesmith
    volumes:
      - rolesmith_pg_data:/var/lib/postgresql/data

volumes:
  rolesmith_pg_data:
